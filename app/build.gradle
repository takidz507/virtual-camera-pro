plugins {
    id 'com.android.application'
}

android {
    namespace 'com.takidz.vcam'
    compileSdk 34

    defaultConfig {
        applicationId "com.takidz.vcam"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0.0-zero-xposed"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'

    // 1. Pure Java Hidden-API Unlocker (Android 9 - 16) for Binder ICameraService & ICameraDeviceUser Proxy (Zero Root, Zero Xposed!)
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    // 2. Standalone In-Process ART Method Hook Engine (Pine) — Works WITHOUT Xposed and WITHOUT Root!
    implementation 'top.canyie.pine:core:0.3.0'

    // 3. Optional Xposed API (compileOnly) for backward compatibility with LSPatch if desired
    compileOnly 'de.robv.android.xposed:api:82'
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.takidz.vcam'
    compileSdk 34

    defaultConfig {
        applicationId "com.takidz.vcam"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0-pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'

    // Xposed API (compileOnly so the APK installs and runs normally on ANY non-root phone,
    // while also working as an LSPatch module for patching third-party apps without root!)
    compileOnly 'de.robv.android.xposed:api:82'
}
